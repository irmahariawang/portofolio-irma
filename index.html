<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portofolio Irma Indriana Hariawang</title>
<style>
  :root{
    --teal-dark:#a10303;
    --teal:#f88238;
    --teal-light:#feeae0;
    --bg:#fff0f0;
    --text:#0c2f4a;
    --muted:#5b7d95;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:24px 40px;
    background:#ffffff;
    border-bottom:1px solid #e2f3f1;
  }
  .logo-mark{
    width:42px;
    height:42px;
    border-radius:10px;
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:700;
    font-size:18px;
  }
  header h1{
    font-size:22px;
    letter-spacing:1px;
    margin:0;
    color:var(--teal-dark);
  }
  main{
    max-width:820px;
    margin:0 auto;
    padding:48px 24px 80px;
  }
  main > p.subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:36px;
  }
  .card-link{
    display:block;
    text-decoration:none;
    color:inherit;
  }
  .card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    background:#ffffff;
    border:1.5px solid var(--teal);
    border-radius:14px;
    padding:26px 30px;
    margin-bottom:24px;
    box-shadow:0 2px 8px rgba(3,105,161,0.06);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .card-link:hover .card{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(3,105,161,0.15);
    background:var(--teal-light);
  }
  .card-text h2{
    margin:0 0 4px;
    font-size:19px;
    color:var(--teal-dark);
  }
  .card-text p{
    margin:0;
    font-size:14px;
    color:var(--muted);
  }
  .arrow{
    font-size:22px;
    color:var(--teal);
  }
</style>
</head>
<body>

<header>
</header>

<main>
  <p class="subtitle"></p>

  <a class="card-link" href="https://irmahariawang.github.io/jumlah-pasien/" target="_blank" rel="noopener noreferrer">
    <div class="card">
      <div class="card-text">
        <h2>Dashboard Jumlah Pasien</h2>
        <p>Jumlah kunjungan pasien</p>
      </div>
      <span class="arrow">&rarr;</span>
    </div>
  </a>

  <a class="card-link" href="https://irmahariawang.github.io/best-seller/" target="_blank" rel="noopener noreferrer">
    <div class="card">
      <div class="card-text">
        <h2>Dashboard Best Seller Treatment</h2>
        <p>Treatment yang diminati</p>
      </div>
      <span class="arrow">&rarr;</span>
    </div>
  </a>

  <a class="card-link" href="https://irmahariawang.github.io/masalah-kulit/" target="_blank" rel="noopener noreferrer">
    <div class="card">
      <div class="card-text">
        <h2>Dashboard Masalah Kulit</h2>
        <p>Distribusi keluhan masalah kulit</p>
      </div>
      <span class="arrow">&rarr;</span>
    </div>
  </a>
  
    <a class="card-link" href="https://irmahariawang.github.io/skin-analisis/" target="_blank" rel="noopener noreferrer">
    <div class="card">
      <div class="card-text">
        <h2>AI Skin Analysis</h2>
        <p>Analisa kondisi kulitmu dengan cepat</p>
      </div>
      <span class="arrow">&rarr;</span>
    </div>
  </a>
</main>
</body>
</html>
